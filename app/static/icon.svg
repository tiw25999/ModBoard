<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: rounded square with ink gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#0e1014"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="22%" r="50%">
      <stop offset="0%"  stop-color="#ffb547" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb547" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Maskable-safe area: keep important content inside the inner 80% (~52px padding) -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" fill="url(#glow)"/>

  <!-- Pulse dot -->
  <circle cx="160" cy="160" r="22" fill="#ffb547">
    <animate attributeName="opacity" values="1;0.5;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- "M" wordmark -->
  <text x="256" y="340" text-anchor="middle"
        font-family="ui-monospace, 'JetBrains Mono', monospace"
        font-size="280" font-weight="700" fill="#f1e7d3"
        letter-spacing="-8">M</text>

  <!-- Bottom accent bar -->
  <rect x="160" y="402" width="192" height="6" rx="3" fill="#ffb547"/>
</svg>
