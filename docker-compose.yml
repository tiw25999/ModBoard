# 0-downtime topology with hardened network segmentation:
#
#   cloudflared ──┐
#                 ▼     (edge network)
#               caddy ──┬──► app1
#                       └──► app2
#                                ▼  (backend network)
#                              db
#                              db-backup
#
# Two docker networks isolate the data tier from the request path:
#   edge:    cloudflared, caddy, app1, app2  (HTTP traffic)
#   backend: db, db-backup, app1, app2        (Postgres only)
#
# That means a compromise of cloudflared (or the edge network in
# general) does NOT give the attacker a direct route to Postgres —
# they'd still have to go through the app, which has its own
# authorization layer.
#
# IMPORTANT: caddy declares network alias `app` on the edge network,
# so the existing Cloudflare Tunnel target `http://app:8000` keeps
# resolving without a dashboard edit during cutover.

x-app: &app
  image: modboard-app:latest
  build: .
  env_file: .env
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 20s
  restart: unless-stopped
  networks: [edge, backend]

services:
  app1:
    <<: *app
    environment:
      RUN_POLLER: "true"

  app2:
    <<: *app
    environment:
      RUN_POLLER: "false"

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      # Bind to loopback only — Cloudflare Tunnel reaches us via the
      # docker network, not via the host port. Host port is just for
      # deploy.sh smoke checks.
      - "127.0.0.1:8000:8000"
    networks:
      edge:
        aliases:
          # Cloudflare Tunnel was originally configured to dial
          # `http://app:8000`. Keeping the alias here means the
          # cutover to caddy+app1+app2 requires ZERO dashboard
          # changes — `app` now resolves to caddy.
          - app
    depends_on:
      - app1
      - app2
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    # Only on the backend network — NOT reachable from caddy/cloudflared.
    networks: [backend]

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    # No env_file — cloudflared only needs the token, which is passed
    # explicitly. Avoids leaking SESSION_SECRET / GOOGLE_CLIENT_SECRET
    # into a container that has no business knowing them.
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN}
    depends_on:
      - caddy
    restart: unless-stopped
    networks: [edge]

  db-backup:
    image: postgres:15-alpine
    volumes:
      - ./backups:/backups
    # Same scoping rationale — db-backup only needs Postgres creds.
    # Passing the full .env here would mean every shell into the
    # backup container leaks unrelated secrets via `env`.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          pg_dump -h db -U "$$POSTGRES_USER" --format=custom "$$POSTGRES_DB" > "/backups/modboard_$$(date +%F).dump"
          find /backups -name "modboard_*.dump" -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
