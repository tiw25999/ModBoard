# 0-downtime topology:
#   cloudflared → caddy → [app1 round-robin app2]
# Both app replicas share image `modboard-app:latest`. Only one
# (app1) runs the Steam poller; the other (app2) is HTTP-only.
# deploy.sh rebuilds the image then rolls them one at a time —
# Caddy's active health checks route around whichever is down.
#
# IMPORTANT: After first switch to this compose, update the
# Cloudflare Tunnel public hostname target in the Zero Trust
# dashboard from  http://app:8000  →  http://caddy:8000

x-app: &app
  image: modboard-app:latest
  build: .
  env_file: .env
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 20s
  restart: unless-stopped

services:
  app1:
    <<: *app
    environment:
      RUN_POLLER: "true"

  app2:
    <<: *app
    environment:
      RUN_POLLER: "false"

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      # Bind to loopback only — Cloudflare Tunnel reaches us via the
      # docker network (service name `caddy`), not via the host port.
      # The host port is just so deploy.sh can run smoke checks.
      - "127.0.0.1:8000:8000"
    depends_on:
      - app1
      - app2
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    env_file: .env
    depends_on:
      - caddy
    restart: unless-stopped

  db-backup:
    image: postgres:15-alpine
    env_file: .env
    volumes:
      - ./backups:/backups
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          pg_dump -h db -U "$$POSTGRES_USER" --format=custom "$$POSTGRES_DB" > "/backups/modboard_$$(date +%F).dump"
          find /backups -name "modboard_*.dump" -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
