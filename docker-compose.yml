# 0-downtime topology with hardened network segmentation:
#
#   cloudflared ──┐
#                 ▼     (edge network)
#               caddy ──┬──► app1
#                       └──► app2
#                                ▼  (backend network)
#                              db
#                              db-backup
#
# Two docker networks isolate the data tier from the request path:
#   edge:    cloudflared, caddy, app1, app2  (HTTP traffic)
#   backend: db, db-backup, app1, app2        (Postgres only)
#
# That means a compromise of cloudflared (or the edge network in
# general) does NOT give the attacker a direct route to Postgres —
# they'd still have to go through the app, which has its own
# authorization layer.
#
# IMPORTANT: caddy declares network alias `app` on the edge network,
# so the existing Cloudflare Tunnel target `http://app:8000` keeps
# resolving without a dashboard edit during cutover.

x-app: &app
  image: modboard-app:latest
  build: .
  env_file: .env
  volumes:
    - modboard_files:/data/mod_files
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 20s
  restart: unless-stopped
  networks: [edge, backend]
  # Bound per-container resources so a runaway poller / pathological
  # regex on a giant body can't starve the rest of the box (db, caddy).
  # 512M is generous for FastAPI; 1 CPU absorbs short bursts.
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 512M
      reservations:
        memory: 128M
  # Per-container log rotation so a chatty app or runaway log can't
  # silently fill the host disk (which would crash db-backup with no
  # alert). Set here explicitly instead of relying on the host
  # /etc/docker/daemon.json — that's invisible from the repo and
  # easy to lose across server rebuilds.
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  app1:
    <<: *app
    environment:
      RUN_POLLER: "true"

  app2:
    <<: *app
    environment:
      RUN_POLLER: "false"

  caddy:
    # Digest-pinned for supply-chain reproducibility. Bump via:
    #   docker buildx imagetools inspect caddy:2-alpine
    image: caddy:2-alpine@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      # Bind to loopback only — Cloudflare Tunnel reaches us via the
      # docker network, not via the host port. Host port is just for
      # deploy.sh smoke checks.
      - "127.0.0.1:8000:8000"
    networks:
      edge:
        aliases:
          # Cloudflare Tunnel was originally configured to dial
          # `http://app:8000`. Keeping the alias here means the
          # cutover to caddy+app1+app2 requires ZERO dashboard
          # changes — `app` now resolves to caddy.
          - app
    depends_on:
      - app1
      - app2
    restart: unless-stopped

  db:
    image: postgres:15-alpine@sha256:df7bca0066e6f60cc3dd32faa70caddec20e2c22b58932f79498e5704b23854a
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          memory: 256M
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    # Only on the backend network — NOT reachable from caddy/cloudflared.
    networks: [backend]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  cloudflared:
    # Pinned to a specific tag digest so a poisoned :latest push can't
    # silently land on the server. Bump deliberately via:
    #   docker buildx imagetools inspect cloudflare/cloudflared:latest
    image: cloudflare/cloudflared:latest@sha256:59bab8d3aceec09bf6bdb07d6beca0225ca5cd7ab79436a87ea97978fe1dc4f9
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    # No env_file — cloudflared only needs the token, which is passed
    # explicitly. Avoids leaking SESSION_SECRET / GOOGLE_CLIENT_SECRET
    # into a container that has no business knowing them.
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN}
    depends_on:
      - caddy
    restart: unless-stopped
    networks: [edge]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  db-backup:
    image: postgres:15-alpine@sha256:df7bca0066e6f60cc3dd32faa70caddec20e2c22b58932f79498e5704b23854a
    volumes:
      - ./backups:/backups
    # Same scoping rationale — db-backup only needs Postgres creds.
    # Passing the full .env here would mean every shell into the
    # backup container leaks unrelated secrets via `env`.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          pg_dump -h db -U "$$POSTGRES_USER" --format=custom "$$POSTGRES_DB" > "/backups/modboard_$$(date +%F).dump"
          find /backups -name "modboard_*.dump" -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  modboard_files:

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
